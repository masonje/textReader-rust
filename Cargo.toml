[package]
name = "clipboard-reader"
version = "2.0.0-alpha.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.37.0"
global-hotkey = "0.10.0"
hound = "3.5.1"
ksni = { version = "0.3.7", features = ["blocking"] }
libloading = "0.9.1"
ort = "2.0.0-rc.15"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-normalization = "0.1.26"
ureq = "3.5.2"
uuid = { version = "1.29.3", features = ["v4"] }

[profile.release]
strip = true
